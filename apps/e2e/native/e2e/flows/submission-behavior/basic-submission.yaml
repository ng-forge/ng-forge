appId: com.ngforge.e2e
name: Basic submission
tags: [submission-behavior]
---
- runFlow:
    file: ../../common/open-scenario.yaml
    env: { SUITE: submission-behavior, SCENARIO: basic-submission }
- tapOn: { id: email-input }
- inputText: user@example.com
- tapOn: { id: name-input }
- inputText: Jane Doe
- hideKeyboard
- tapOn: { id: submitForm-button }
- copyTextFrom: { id: submission-count }
- assertTrue: ${maestro.copiedText == '1'}
- runFlow: ../../common/read-submission.yaml
- assertTrue: ${JSON.parse(maestro.copiedText).email == 'user@example.com'}
- assertTrue: ${JSON.parse(maestro.copiedText).name == 'Jane Doe'}
