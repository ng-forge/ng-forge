appId: com.ngforge.e2e
name: Text and textarea
tags: [conditional-logic]
---
- runFlow:
    file: ../../common/open-scenario.yaml
    env: { SUITE: conditional-logic, SCENARIO: text-and-textarea }
- assertVisible: { id: heading, text: Tell us about yourself }
- tapOn: { id: bio-textarea }
- inputText: Loves forms
- runFlow: ../../common/read-value.yaml
- assertTrue: ${JSON.parse(maestro.copiedText).bio == 'Loves forms'}
- takeScreenshot: text-and-textarea
